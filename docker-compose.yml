services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lexguard-postgres
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lexguard_pgdata:/var/lib/postgresql/data
      - ./backend-api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lexguard_pgdata:
